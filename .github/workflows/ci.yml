name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ae1d787cccfc25e920bb60bcd7666e8217f9a191 # 1.83.0 branch; installs Rust 1.83.0
      - name: Test
        run: cargo test --locked --release
      - name: Multi-agent workflow timings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo test --locked --release --test multi_agent -- --nocapture
      - name: Build the examples (harness, bench, checks)
        run: cargo build --locked --release --examples
      - name: No crate dependencies
        run: cargo run --locked --release --example check_zero_deps
      - name: No leftover markers
        run: cargo run --locked --release --example check_no_todos

  python-legacy:
    name: python-legacy still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch the Python tree
        run: git fetch --force origin tag pre-rust-python-legacy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and import
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/coordinationhub-python pre-rust-python-legacy
          python -m pip install -e "/tmp/coordinationhub-python" pytest
          python -c "import coordinationhub; assert coordinationhub.__version__ == '0.8.0'"
          python -m pytest /tmp/coordinationhub-python/tests -q --tb=line

  parity:
    name: parity harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@ae1d787cccfc25e920bb60bcd7666e8217f9a191 # 1.83.0 branch; installs Rust 1.83.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch the Python tree
        run: git fetch --force origin tag pre-rust-python-legacy
      - name: Build
        run: cargo build --locked --release
      - name: Install the stdio package Python 0.8.0 needs
        run: python -m pip install "mcp==1.30.0"
      - name: Compare
        run: cargo run --locked --release --example parity -- target/release/coordinationhub --python python
