# Builds release binaries and a checksum file when a tag is pushed.
# Pull requests do not run this workflow. Do not push a tag from a pull request.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: coordinationhub-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: coordinationhub-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: coordinationhub-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: coordinationhub-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: coordinationhub-windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/coordinationhub${ext}" "dist/${{ matrix.asset }}/"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.sha256

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job has no checkout, so gh needs the repository named.
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          notes="CoordinationHub ${tag}. Check SHA256SUMS before use. Binaries: linux x64, linux arm64, macOS x64, macOS arm64, Windows x64."
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            # A rerun, or a release made by hand: replace the assets in place.
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --repo "$repo" --title "$tag" --notes "$notes"
          fi
