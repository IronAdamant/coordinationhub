name: Release binaries

# Builds the six release binaries and writes SHA256SUMS.
# A tag push also attaches those files to a GitHub Release.
# This workflow does not publish to a package registry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          git init -q
          git config --global --add safe.directory "$PWD"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --depth=1 origin "${{ github.sha }}"
          else
            git fetch --depth=1 origin "refs/tags/${TAG}"
          fi
          git checkout --force FETCH_HEAD

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.83.0
          source "$HOME/.cargo/env"
          rustup target add "${{ matrix.target }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Linux aarch64 linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build and pack
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target "${{ matrix.target }}"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/coordinationhub${ext}" "dist/coordinationhub-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/coordinationhub-mcp${ext}" "dist/coordinationhub-mcp-${{ matrix.target }}${ext}"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Show checksums
        shell: bash
        run: cat dist/SHA256SUMS

      - name: Attach binaries to the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${{ github.repository }}"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$repo" --title "coordinationhub $tag" --notes "Rust binaries. SHA256SUMS is attached per target."
          gh release upload "$tag" --repo "$repo" --clobber dist/*
