name: Release (GitHub + PyPI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:     # Manually (re)publish an existing tag, e.g. after a PyPI outage
    inputs:
      tag:
        description: 'Existing release tag to (re)publish (e.g. v0.8.0)'
        required: true
        type: string

# Single deliberate exception to the zero-third-party-actions rule (maintainer
# decision, 2026-06-11): PyPI publishing uses the official pypa/gh-action-pypi-publish,
# pinned to a commit SHA. The previous hand-rolled curl mint-token + twine step
# was replaced because the official action is the supported trusted-publishing
# path. All other steps still use only pre-installed tools.
#
# This single workflow handles the full release:
# 1. Build sdist + wheel
# 2. Create GitHub Release + attach artifacts
# 3. Publish those exact artifacts to PyPI via OIDC Trusted Publishing

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout at the exact tag
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          git init -q
          git config --global --add safe.directory "$PWD"
          git remote add origin "https://github.com/${REPO}.git"
          git -c protocol.version=2 fetch --depth=1 origin "refs/tags/${TAG}"
          git checkout --force FETCH_HEAD

      - name: Select Python 3.12 from tool cache
        run: |
          set -euo pipefail
          PY_DIR=$(ls -d /opt/hostedtoolcache/Python/3.12.*/x64 2>/dev/null | sort -V | tail -1)
          if [ -z "$PY_DIR" ] || [ ! -x "$PY_DIR/bin/python" ]; then
            echo "::error::Python 3.12 not found in tool cache"
            exit 1
          fi
          echo "$PY_DIR/bin" >> "$GITHUB_PATH"
          "$PY_DIR/bin/python" --version

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check build
          python -m build
          ls -lh dist/

      - name: Create or update GitHub Release + attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TITLE="${TAG} — $(git log -1 --pretty=%s || echo 'Release')"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets (idempotent re-run)"
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*.tar.gz dist/*.whl || true
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --generate-notes \
              --verify-tag \
              dist/*.tar.gz \
              dist/*.whl
            echo "Created GitHub Release $TAG with attached artifacts."
          fi

          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'

  publish-pypi:
    needs: create-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the GitHub Release artifacts (exact bytes that were attached)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --dir dist
          ls -lh dist/

      - name: Publish to PyPI (official PyPA action, OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
